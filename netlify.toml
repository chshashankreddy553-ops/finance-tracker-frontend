[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to live backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://two4eg107d13-finance-tracker.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback all other routes to index.html for React SPA client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
